<!doctype html>
<html lang="ro"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cafeneaua d'Acasa — Meniu</title>
<style>
:root{--bg:#090909;--card:#141414;--gold:#e9b95d;--cream:#f4e7c5;--muted:#aaa39a;--line:#302d28}
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f7f3eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:520px;min-height:100vh;margin:auto;background:linear-gradient(#0b0b0b,#080808)}
header{height:72px;position:sticky;top:0;z-index:5;background:#0b0b0bf2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
button{font:inherit;cursor:pointer}.icon{border:0;background:none;color:var(--cream);font-size:24px}.brand{font:700 19px Georgia,serif;text-align:center;line-height:.9;color:var(--cream)}.brand small{display:block;color:var(--gold);font:11px Georgia,serif;margin-top:5px}
.hero{text-align:center;padding:32px 20px 18px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800}h1{font:700 38px/1.05 Georgia,serif;color:var(--cream);margin:9px 0}.hero p{color:var(--muted);margin:0 auto 20px}
.table{display:inline-block;border:1px solid #665331;background:#17130c;color:var(--cream);padding:9px 15px;border-radius:30px;font-size:13px}
.cats{display:flex;gap:8px;overflow:auto;padding:8px 18px 15px}.cat{white-space:nowrap;border:1px solid var(--line);background:#111;color:#ddd;border-radius:30px;padding:10px 14px}.cat.active{background:var(--gold);color:#17110a;border-color:var(--gold);font-weight:800}
main{padding:0 18px 110px}.title{display:flex;justify-content:space-between;align-items:end;margin:10px 0 12px}.title h2{font:700 26px Georgia,serif;color:var(--cream);margin:0}.title small{color:var(--muted)}
.product{display:flex;gap:12px;align-items:center;padding:11px;margin:0 0 10px;background:linear-gradient(145deg,#171717,#101010);border:1px solid var(--line);border-radius:16px}.pic{width:68px;height:68px;flex:none;border-radius:12px;background:#211d16;display:grid;place-items:center;font-size:29px}.info{flex:1;min-width:0}.info h3{margin:0 0 4px;font-size:15px}.info p{margin:0;color:var(--muted);font-size:12px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.price{color:var(--gold);font-weight:800}.add{width:34px;height:34px;border-radius:50%;border:1px solid #8c6d36;background:#19140c;color:var(--gold);font-size:22px}
#bar{display:none;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(484px,calc(100% - 28px));z-index:10;border:0;border-radius:16px;background:var(--gold);color:#17110a;padding:15px 18px;font-weight:900;justify-content:space-between;box-shadow:0 10px 35px #000;cursor:pointer}.show{display:flex!important}
.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:20}.drawer{position:absolute;right:0;top:0;height:100%;width:min(500px,100%);background:#0d0d0d;border-left:1px solid var(--line);padding:20px;overflow:auto}.drawer.open{display:block}
.head{display:flex;justify-content:space-between}.head h2{font:700 28px Georgia,serif;margin:0;color:var(--cream)}.close{border:0;background:none;color:#ddd;font-size:28px}
.item{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.grow{flex:1}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#171717;color:white}.total{display:flex;justify-content:space-between;font-weight:900;font-size:20px;margin:22px 0;color:var(--cream)}
.pay{width:100%;text-align:left;border:1px solid var(--line);background:#121212;color:#eee;border-radius:14px;padding:14px;margin:6px 0}.pay.selected{border-color:var(--gold)}.pay strong{display:block;color:var(--gold)}.send{width:100%;border:0;background:var(--gold);color:#17110a;border-radius:14px;padding:15px;font-weight:900;margin-top:12px}
.confirm{display:none;text-align:center;padding:70px 20px}.confirm h2{font:700 28px Georgia,serif;color:var(--cream)}.check{font-size:70px;color:var(--gold)}
</style></head>
<body><div class="app">
<header><button class="icon">☰</button><div class="brand">Cafeneaua<br>d'Acasa<small>cafea bună & energii primitoare</small></div><button class="icon" onclick="openCart()">🛒 <sup id="badge">0</sup></button></header>
<section class="hero"><div class="eyebrow">Bine ai venit!</div><h1>Gustul bun începe cu o comandă.</h1><p>Descoperă meniul și comandă direct la masa ta.</p><div class="table">🪑 Masa <b id="table">7</b></div></section>
<nav id="cats" class="cats"></nav><main><div id="menu"></div><div id="confirm" class="confirm"><div class="check">✓</div><h2>Comanda a fost trimisă!</h2><p id="confirmText"></p><button class="send" onclick="location.reload()">Înapoi la meniu</button></div></main>
<button id="bar" onclick="openCart()"><span>🛒 Vezi comanda</span><span id="barTotal">0 LEI</span></button></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeCart()"><aside class="drawer" id="drawer"><div class="head"><h2>Coșul tău</h2><button class="close" onclick="closeCart()">×</button></div><div id="items"></div><div class="total"><span>Total</span><span id="total">0 LEI</span></div>
<button id="online" class="pay selected" onclick="payment='online';selectPay()">💳 <strong>Plată online</strong>Card bancar · rapid · securizat</button>
<button id="cash" class="pay" onclick="payment='cash';selectPay()">💵 <strong>Cash la bar</strong>Plătești la bar după comandă</button>
<button class="send" onclick="sendOrder()">Trimite comanda</button></aside></div>
<script>
const P=[
['Coffee','☕','Espresso','50ml',9],['Coffee','☕','Americano','150ml',9],['Coffee','☕','Espresso Dublu','75ml',13],['Coffee','☕','Espresso Macchiato','75ml',10],['Coffee','☕','Cappuccino','200ml',11],['Coffee','☕','Flat White','150ml',15],['Coffee','☕','Latte','250ml',16],['Coffee','🧊','Espresso Tonic','200ml',16],['Coffee','🧊','Iced Coffee','250ml',16],['Coffee','🥛','Frappe','250ml',16],['Coffee','🥛','Cold Brew Latte','250ml',16],['Coffee','☕','Dubai Latte','250ml',25],
['Ceai','🍵','Ceai Red Fruit Flash','Infuzie de fructe',12],['Ceai','🍵','Ceai Royal Earl Grey','Ceai negru aromat',12],['Ceai','🍵','Ceai Smooth Mint','Mentă',12],['Ceai','🍵','Ceai Jasmine Ting Yuan','Iasomie',12],['Ceai','🍵','Ceai Fancy Chamomile','Mușețel',12],['Ceai','🍵','Ceai Ginseng Valley','Ginseng',12],['Ceai','🍵','Ceai Măr și Scorțișoară','Infuzie aromată',12],
['Non-coffee','🥤','Matcha Latte','',16],['Non-coffee','🥤','Iced Matcha Latte','',17],['Non-coffee','🥤','Blue Matcha','',15],['Non-coffee','🥤','Iced Blue Matcha','',16],['Non-coffee','🥤','Pink Matcha','',15],['Non-coffee','🥤','Iced Pink Matcha','',15],['Non-coffee','🥤','Masala Latte','',14],['Non-coffee','🥤','Iced Masala Latte','',15],['Non-coffee','🍫','Ciocolată caldă neagră','',15],['Non-coffee','🍫','Ciocolată caldă albă','',15],['Non-coffee','🍫','Marshmallow Chocolate','',16],
['Băuturi răcoritoare','🍋','Fresh','',15],['Băuturi răcoritoare','🍋','Limonadă clasică','',15],['Băuturi răcoritoare','🍋','Limonadă mentă','',17],['Băuturi răcoritoare','🍓','Limonadă fructe','',18],['Băuturi răcoritoare','💧','Apă plată 0,5L','',9],['Băuturi răcoritoare','💧','Apă minerală 0,5L','',9],['Băuturi răcoritoare','🥤','Pepsi 0,25','',10],['Băuturi răcoritoare','🥤','Pepsi Max 0,25','',10],['Băuturi răcoritoare','🥤','7UP 0,25','',10],
['Bere','🍺','Bergenbier 500ml','',11],['Bere','🍺','Bergenbier fără alcool 500ml','',11],['Bere','🍺','Carlsberg 500ml','',11],['Bere','🍺','Stella Artois 500ml','',11],['Bere','🍺','Beck’s 500ml','',11],['Bere','🍺','Heineken 500ml','',11],['Bere','🍺','Corona Extra 330ml','',15],
['Draft','🍺','Bere Casei','',11],['Draft','🍺','Stella Artois','',13],
['Cocktails','🍸','Aperol Spritz','',26],['Cocktails','🍸','Gin Tonic','',26],['Cocktails','🍸','Gin Pink','',26],['Cocktails','🍸','Hugo','',26],['Cocktails','🍸','Vodka Apple','',28],['Cocktails','🍸','Vodka Orange','',26],['Cocktails','🍸','Vodka Cranberry','',26],['Cocktails','🍸','Margarita','',26],['Cocktails','🍸','Mojito','',26],['Cocktails','🍸','Espresso Martini','',33],['Cocktails','🍸','Pornstar Martini','',33],
['Shot-uri','🥃','Bumbu','30ml / 50ml',22],['Shot-uri','🥃','Bumbu Cream','',12],['Shot-uri','🥃','Vodka Stalinskaya','',10],['Shot-uri','🥃','Vodka SKY','',12],['Shot-uri','🥃','Jack Daniel’s','',17],['Shot-uri','🥃','Jidvei','',15],['Shot-uri','🥃','Jameson','',15],['Shot-uri','🥃','Jäger','',15],['Shot-uri','🥃','Stroh','',15]
];
const cats=['Coffee','Ceai','Non-coffee','Băuturi răcoritoare','Bere','Draft','Vinuri','Cocktails','Shot-uri'];let active='Coffee',cart={},payment='online';
const table=new URLSearchParams(location.search).get('masa')||'7';document.getElementById('table').textContent=table;
function money(n){return n+' LEI'}function renderCats(){catsEl.innerHTML=cats.map(c=>'<button class="cat '+(c==active?'active':'')+'" onclick="setCat(this.textContent)">'+c+'</button>').join('')}
function setCat(c){active=c;renderCats();render()}
function render(){let a=P.filter(x=>x[0]==active);menu.innerHTML='<div class="title"><h2>'+active+'</h2><small>'+a.length+' produse</small></div>'+a.map((p)=>'<article class="product"><div class="pic">'+p[1]+'</div><div class="info"><h3>'+p[2]+'</h3><p>'+p[3]+'</p><div class="bottom"><span class="price">'+money(p[4])+'</span><button class="add" onclick="add('+P.indexOf(p)+')">+</button></div></div></article>').join('')}
function add(i){cart[i]=(cart[i]||0)+1;update()}function change(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];renderCart();update()}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}function sum(){return Object.entries(cart).reduce((s,[i,q])=>s+P[i][4]*q,0)}
function update(){badge.textContent=count();barTotal.textContent=money(sum());bar.classList.toggle('show',count()>0)}
function openCart(){renderCart();overlay.style.display='block'}function closeCart(){overlay.style.display='none'}
function renderCart(){items.innerHTML=Object.entries(cart).map(([i,q])=>'<div class="item"><div class="grow"><b>'+P[i][2]+'</b><div class="price">'+money(P[i][4]*q)+'</div></div><div class="qty"><button onclick="change('+i+',-1)">−</button> '+q+' <button onclick="change('+i+',1)">+</button></div></div>').join('')||'<p style="color:var(--muted)">Coșul este gol.</p>';total.textContent=money(sum())}
function selectPay(){online.classList.toggle('selected',payment=='online');cash.classList.toggle('selected',payment=='cash')}
function sendOrder(){if(!count())return alert('Adaugă cel puțin un produs.');confirmText.textContent='Masa '+table+' · '+count()+' produse · '+money(sum())+' · '+(payment=='online'?'Plată online':'Plată cash la bar');overlay.style.display='none';menu.style.display='none';catsEl.style.display='none';document.querySelector('.hero').style.display='none';bar.classList.remove('show');confirm.style.display='block';cart={}}
const catsEl=document.getElementById('cats');renderCats();render();update();
</script></body></html>
